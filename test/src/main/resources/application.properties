# 服务端口
server.port=8080

# MySQL 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.example.test.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# DevTools
spring.devtools.restart.enabled=true

# ============ 迁移自 file-preview-demo admin-server（Express）的配置 ============
# JWT 令牌
app.jwt.secret=development-secret-change-me-1234567890
app.jwt.expires-in-seconds=7200
# CORS 允许来源（逗号分隔）
app.cors.origins=http://localhost:5173
# AI 网关（OpenAI 兼容）
app.ai.gateway-base-url=http://192.168.10.64:3000/v1
app.ai.api-key=sk-wmOVQ98HShq0dr4IdOaux2RW4jbVUVhIRUETj9bwkZx6IEqB
app.ai.model=gpt-5.6-sol
# 文件上传（AI 对话附件：单文件 10MB、总计 20MB，留余量）
